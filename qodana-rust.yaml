# Qodana for Rust (Early Access): the Cargo workspace — crates/randommac-core, randommac-net,
# randommac-cli and the Tauri shell in src-tauri/. Run by .github/workflows/qodana.yml (job `rust`,
# Docker, `--config qodana-rust.yaml`), reported to the Qodana Cloud project randomMAC-Rust (secret
# QODANA_TOKEN_RUST). The UI, scripts and workflows belong to the JS/TS project (qodana.yaml).
version: "1.0"
linter: qodana-rust
profile:
  name: qodana.recommended
# The quality gate: any problem fails the job.
failureConditions:
  severityThresholds:
    any: 0
# The linter evaluates build scripts and expands macros with `cargo check`, and its image has
# neither a C toolchain nor the libraries Tauri links against (the packages ci.yml installs). Needs
# root in the container: the workflow passes `-u root`.
bootstrap: |
  apt-get update -qq
  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
exclude:
  - name: All
    paths:
      # The JS/TS project's files (qodana.yaml).
      - src
      - scripts
      - docs
      - .github
      - node_modules
      - index.html
      - vite.config.ts
      - svelte.config.js
      - eslint.config.js
      # Build output, reports and generated files.
      - target
      - dist
      - coverage
      - src-tauri/gen
      # Generated from the IEEE registry by scripts/gen-oui.mjs.
      - crates/randommac-core/src/oui/vendors.rs
  # tauri::generate_handler! needs each command's module path (`commands::app_info`): the
  # #[tauri::command] macro puts a hidden helper next to the function, and the handler finds it
  # through that path. Without the prefix the crate no longer compiles.
  - name: RsUnnecessaryQualifications
    paths:
      - src-tauri/src/lib.rs
  # rustc is the authority on type and borrow errors (CI builds everything with clippy
  # -D warnings). The Early Access linter's own checker reports errors in code that compiles, e.g.
  # every integer operator in crates/randommac-core/src/random.rs (E0369, E0382), or `u8`, `u32`
  # and `bool` fields "not implementing" Copy/Eq/Debug under a derive in
  # crates/randommac-core/src/dns/wire.rs (E0277).
  - name: RsTraitObligations
  - name: RsBorrowChecker
  - name: RsDerivableTraitMembers
