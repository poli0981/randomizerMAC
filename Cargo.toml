[workspace]
resolver = "3"
members = [
    "crates/randommac-core",
    "crates/randommac-net",
    "crates/randommac-cli",
    "src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["poli0981"]
repository = "https://github.com/poli0981/randomizerMAC"
homepage = "https://github.com/poli0981/randomizerMAC"

[workspace.dependencies]
randommac-core = { path = "crates/randommac-core" }
randommac-net = { path = "crates/randommac-net" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
fd-lock = "4"
getrandom = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
# Keep dependency builds reasonably fast while the app stays debuggable.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
