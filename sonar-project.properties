# SonarQube Cloud: https://sonarcloud.io/project/overview?id=poli0981_randomizerMAC
# The analysis runs in CI (.github/workflows/ci.yml, job "SonarQube Cloud") after the test jobs,
# with their coverage reports. Automatic analysis is turned off in the project settings.
sonar.organization=poli0981
sonar.projectKey=poli0981_randomizerMAC
sonar.projectName=RandomMac
sonar.sourceEncoding=UTF-8

# Rust workspace, desktop shell, UI, scripts, workflows and the root build configuration.
sonar.sources=crates,src-tauri,src,scripts,.github,index.html,vite.config.ts,svelte.config.js,eslint.config.js
sonar.tests=crates,src
sonar.test.inclusions=crates/*/tests/**,src/**/*.test.ts
sonar.exclusions=crates/*/tests/**,src/**/*.test.ts,crates/randommac-core/src/oui/vendors.rs,src-tauri/icons/**

# Coverage written by CI (`cargo llvm-cov` on Windows and Linux, `npm run test:coverage`).
sonar.rust.lcov.reportPaths=coverage/rust-Linux.info,coverage/rust-Windows.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Not measured by unit tests:
# - the Tauri runtime glue (commands, startup, tray, updater, scheduler, the change runner): it needs
#   a running app with a WebView and is exercised by the GUI smoke tests in the Bundle job; the
#   logic it calls lives in randommac-core / randommac-net and is covered there;
# - build scripts, the UI bootstrap, build configuration and release tooling run by the workflows.
sonar.coverage.exclusions=\
  src-tauri/build.rs,\
  src-tauri/src/main.rs,\
  src-tauri/src/lib.rs,\
  src-tauri/src/commands.rs,\
  src-tauri/src/ops_runner.rs,\
  src-tauri/src/scheduler.rs,\
  src-tauri/src/state.rs,\
  src-tauri/src/tray.rs,\
  src-tauri/src/updater.rs,\
  src/main.ts,\
  scripts/**,\
  vite.config.ts,\
  svelte.config.js,\
  eslint.config.js
