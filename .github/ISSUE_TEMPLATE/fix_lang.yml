name: Language / Translation Fix
description: Report a translation error or request a new language
title: "[Lang]: "
labels: ["localization"]
body:
  - type: markdown
    attributes:
      value: |
        All translations other than English are AI-generated. Thank you for helping to improve them.

  - type: input
    id: language
    attributes:
      label: Language
      description: Which language is affected (or which one should be added)?
      placeholder: Vietnamese
    validations:
      required: true

  - type: dropdown
    id: reason
    attributes:
      label: Reason
      options:
        - Translation error (wrong meaning)
        - Unnatural phrasing
        - Wrong terminology (technical terms)
        - Missing translation (English text shown)
        - Add a new language
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        For errors, include:
        - where the text appears (page, dialog, tray menu, notification) and, if known, the key
          from `src/lib/i18n/<language>.ts` or `src-tauri/src/i18n.rs`
        - the current text
        - your suggested correction
        - why the current text is wrong
      placeholder: |
        Where: Settings → General
        Key: settings.language
        Current: "Ngôn ngử"
        Suggested: "Ngôn ngữ"
        Reason: typo
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: A screenshot showing the text in the app.
