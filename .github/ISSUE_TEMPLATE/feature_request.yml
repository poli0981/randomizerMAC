name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion. Please search existing issues first.

  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: What would you like RandomMac to do?
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: Why is it needed? What problem does it solve for you?
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Related area
      options:
        - label: Dashboard / changing addresses
        - label: History
        - label: Settings / blacklist
        - label: Automation
        - label: System tray / notifications
        - label: Command-line tool (randommac-cli)
        - label: Installation / update
        - label: Localization
        - label: UI / UX
        - label: Other

  - type: checkboxes
    id: platform
    attributes:
      label: Platforms
      options:
        - label: Windows
        - label: Linux

  - type: dropdown
    id: priority
    attributes:
      label: Priority for you
      options:
        - Nice to have
        - Should have
        - Must have
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: Mockup, example or reference
      description: Optional — a sketch, an example command line, or a link to a similar tool.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself (see CONTRIBUTING.md)
