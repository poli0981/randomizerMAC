version: 2

updates:
  # NuGet packages — the bulk of the dependency tree.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      # Tuesday avoids the Monday-morning queue across GitHub.
      day: tuesday
      time: '04:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - 'Microsoft.*'
          - 'System.*'
      mvvm-toolkit:
        patterns:
          - 'CommunityToolkit.*'
      serilog:
        patterns:
          - 'Serilog*'
    labels:
      - dependencies
      - nuget
    assignees:
      - poli0981
    reviewers:
      - poli0981
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '04:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    assignees:
      - poli0981
    reviewers:
      - poli0981
    commit-message:
      prefix: 'chore(ci)'
      include: scope
