version: 2

updates:
  # Rust crates (Cargo workspace at the repository root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Tauri crates must move together with @tauri-apps/* (see the npm groups below).
      tauri:
        patterns: ["tauri", "tauri-*"]
      windows-rs:
        patterns: ["windows", "windows-*"]
      rust-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: ["tauri", "tauri-*", "windows", "windows-*"]

  # Frontend packages.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: "chore(deps)"
    # `typescript` (npm:@typescript/typescript6, the TypeScript 6 API) and `@typescript/native`
    # (npm:typescript@7) are npm aliases, which Dependabot skips: update them by hand (CLAUDE.md).
    ignore:
      # Node's type definitions follow the Node major in .nvmrc (26); bump them together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      tauri-js:
        patterns: ["@tauri-apps/*"]
      svelte-vite:
        patterns: ["svelte", "svelte-check", "@sveltejs/*", "vite", "vitest", "@testing-library/*", "jsdom"]
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-*", "typescript-eslint", "prettier", "prettier-*", "globals"]
      npm-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
