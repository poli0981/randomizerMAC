# Keep `name: Release` — notify-ci-failure.yml / notify-release-pipeline.yml watch it by name.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v2.0.0"
        required: true
        type: string
      dry_run:
        description: "Build and verify only; do not create or change the GitHub release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (vX.Y.Z[-pre])"; exit 1
          fi
          version="${tag#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Version files match the tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: node scripts/version.mjs check --tag "$TAG"

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the CLI sidecar
        run: node scripts/build-sidecar.mjs ${{ matrix.triple }}
      - name: Build and sign bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.release.conf.json
      - name: Collect release assets
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          for f in target/release/bundle/{nsis/*-setup.exe,msi/*.msi,deb/*.deb,rpm/*.rpm,appimage/*.AppImage}; do
            cp "$f" out/
            if [ -f "$f.sig" ]; then cp "$f.sig" out/; fi
          done
          cli="randommac-cli-${VERSION}-${TRIPLE}"
          if [[ "$TRIPLE" == *windows* ]]; then
            mkdir -p "$cli" && cp "target/$TRIPLE/release/randommac-cli.exe" LICENSE "$cli/"
            7z a -tzip "out/${cli}.zip" "$cli" > /dev/null
          else
            mkdir -p "$cli" && cp "target/$TRIPLE/release/randommac-cli" LICENSE "$cli/"
            tar -czf "out/${cli}.tar.gz" "$cli"
          fi
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.triple }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets
        run: node scripts/release-assets.mjs verify release-assets
      - name: Generate latest.json (updater manifest)
        run: node scripts/release-assets.mjs latest-json release-assets "$TAG" "$GITHUB_REPOSITORY" "docs/RELEASE_v${VERSION}.md"
      - name: Generate SHA256SUMS.txt
        run: node scripts/release-assets.mjs sums release-assets
      - name: Attest build provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*
      - name: Keep the verified set (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-release-assets
          path: release-assets/*
          retention-days: 7
      - name: Create or update the draft release
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          notes="docs/RELEASE_v${VERSION}.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-runs may finish a draft, but must never replace the assets of a published release.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; release a new version instead of re-running."
              exit 1
            fi
            gh release edit "$TAG" --title "RandomMac $TAG" --notes-file "$notes"
          else
            flags=(--draft --verify-tag --title "RandomMac $TAG" --notes-file "$notes")
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" release-assets/* --clobber
      - name: Publish
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
      # Releases published with GITHUB_TOKEN do not emit `release: published` to other workflows,
      # so the announcement workflows are started explicitly (workflow_dispatch is allowed).
      - name: Announce (Discord + Discussions)
        if: env.DRY_RUN != 'true'
        run: |
          gh workflow run announce-release.yml -f tag="$TAG"
          gh workflow run discussion-on-release.yml -f tag="$TAG"
      - name: Check the published updater manifest
        if: env.DRY_RUN != 'true' && env.PRERELEASE != 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --proto =https --proto-redir =https "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" -o latest.json \
              && [ "$(jq -r .version latest.json)" = "$VERSION" ]; then
              jq -r '.platforms | keys[]' latest.json
              for u in $(jq -r '.platforms[].url' latest.json | sort -u); do
                curl -fsIL --proto =https --proto-redir =https -o /dev/null "$u"
              done
              echo "latest.json OK"; exit 0
            fi
            sleep 10
          done
          echo "::error::latest.json is not serving version $VERSION"; exit 1
