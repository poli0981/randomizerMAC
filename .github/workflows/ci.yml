# Keep `name: CI` — notify-ci-failure.yml watches this workflow by name.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/FUNDING.yml"
      - ".github/CODEOWNERS"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/FUNDING.yml"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull-request runs are cancelled; every push to master keeps its own result.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Versions are in sync
        run: node scripts/version.mjs check
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check .
      - name: svelte-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # tauri::generate_context! embeds the built frontend.
      - run: npm ci
      - run: npm run build
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: CLI against the mock backend
        run: cargo run -q -p randommac-cli --locked -- --mock list --all

  linux-integration:
    name: Linux MAC change (dummy interface)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli
      - run: cargo build -p randommac-cli --locked
      - name: Set, randomize and restore a real (dummy) interface
        run: |
          set -euo pipefail
          sudo ip link add dummy0 type dummy
          sudo ip link set dummy0 up
          cli() { sudo ./target/debug/randommac-cli --data-dir "$RUNNER_TEMP/randommac" "$@"; }
          addr() { cat /sys/class/net/dummy0/address; }
          before=$(addr)
          echo "original: $before"
          cli list --all
          cli set dummy0 02:12:34:56:78:9a
          test "$(addr)" = "02:12:34:56:78:9a"
          cli random dummy0
          test "$(addr)" != "02:12:34:56:78:9a"
          cli --json show dummy0
          cli restore dummy0
          test "$(addr)" = "$before"
          cli history
          # A name smuggling a second ip command must never reach `ip -batch`.
          if cli set $'dummy0\nlink set lo down' 02:00:00:00:00:01; then
            echo "::error::malicious interface name was accepted"; exit 1
          fi
          ip link show lo | grep -q "state UNKNOWN"

  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file rpm xvfb dbus-x11
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bundle
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the CLI sidecar
        run: node scripts/build-sidecar.mjs
      - name: Build bundles (unsigned, no updater artifacts)
        shell: bash
        run: npx tauri build --ci --bundles "${{ matrix.bundles }}" --config '{"bundle":{"externalBin":["binaries/randommac-cli"]}}'

      - name: Inspect and install the .deb
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd target/release/bundle
          ls -la deb rpm appimage
          dpkg-deb -I deb/*.deb
          dpkg-deb -c deb/*.deb | grep -E 'usr/bin/(randommac|randommac-cli)$'
          rpm -qpR rpm/*.rpm
          sudo apt-get install -y ./deb/*.deb
          randommac --version
          randommac-cli --version
          randommac-cli list --all
          WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- xvfb-run -a randommac --smoke-test
      - name: Install the .rpm on Fedora
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/target/release/bundle/rpm:/pkgs:ro" fedora:43 \
            bash -euxc 'dnf install -y /pkgs/*.rpm && randommac-cli --version && randommac --version && rpm -qa | grep -i random'

      - name: Install, smoke-test and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Simulate the elevated logon task RandomMac 1.x left behind.
          $legacy = Join-Path $env:LOCALAPPDATA 'RandomMac\current\RandomMac.App.exe'
          schtasks /Create /TN RandomMac /TR "`"$legacy`"" /SC ONLOGON /RL HIGHEST /F | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = 'C:\Program Files\RandomMac\randommac.exe'
          if (-not (Test-Path $exe)) { throw 'not installed to Program Files' }
          if (-not (Test-Path 'C:\Program Files\RandomMac\randommac-cli.exe')) { throw 'CLI sidecar missing' }
          schtasks /Query /TN RandomMac 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'legacy v1 task was not removed' }
          $global:LASTEXITCODE = 0
          & 'C:\Program Files\RandomMac\randommac-cli.exe' list --all
          $p = Start-Process $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }
          Start-Process 'C:\Program Files\RandomMac\uninstall.exe' -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw 'uninstall left the executable behind' }
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $i = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "msi install failed ($($i.ExitCode))" }
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msi uninstall failed ($($u.ExitCode))" }

      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

  deps-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
