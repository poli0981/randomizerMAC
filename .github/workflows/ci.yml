# Keep `name: CI` — notify-ci-failure.yml watches this workflow by name.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/FUNDING.yml"
      - ".github/CODEOWNERS"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/FUNDING.yml"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull-request runs are cancelled; every push to master keeps its own result.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Versions are in sync
        run: node scripts/version.mjs check
      # Through the package scripts (locked versions in node_modules), not npx.
      - name: ESLint and Prettier
        run: npm run lint
      - name: Type check (svelte-check, TypeScript 7)
        run: npm run check
      - name: Unit tests (with coverage)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: error

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt,clippy,llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # tauri::generate_context! embeds the built frontend.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Same tests as `cargo test --workspace` (there are no doctests), instrumented; the report of
      # each OS covers its own backend and is merged by the SonarQube Cloud job.
      - name: Tests (with coverage)
        shell: bash
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path "coverage/rust-$RUNNER_OS.info"
          node scripts/lcov-paths.mjs "coverage/rust-$RUNNER_OS.info"
      - name: CLI against the mock backend
        run: cargo run -q -p randommac-cli --locked -- --mock list --all
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-rust-${{ runner.os }}
          path: coverage/rust-${{ runner.os }}.info
          retention-days: 7
          if-no-files-found: error

  linux-integration:
    name: Linux MAC change (dummy interface)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      # The real changes below run this instrumented CLI; its coverage of the Linux backend is
      # merged with the unit tests' by the SonarQube Cloud job.
      - name: Build the CLI with coverage instrumentation
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo build -p randommac-cli --locked
      - name: Set, randomize and restore a real (dummy) interface
        run: |
          set -euo pipefail
          source <(cargo llvm-cov show-env --sh)
          # An address given at creation (addr_assign_type 3) is left alone by udev; a random one
          # is rewritten by MACAddressPolicy=persistent shortly after creation, racing `before`.
          sudo ip link add dummy0 address 02:00:00:00:00:10 type dummy
          sudo udevadm settle
          sudo ip link set dummy0 up
          cli() {
            sudo LLVM_PROFILE_FILE="$LLVM_PROFILE_FILE" ./target/debug/randommac-cli \
              --data-dir "$RUNNER_TEMP/randommac" "$@"
          }
          addr() { cat /sys/class/net/dummy0/address; }
          before=$(addr)
          echo "original: $before"
          cli list --all
          cli set dummy0 02:12:34:56:78:9a
          test "$(addr)" = "02:12:34:56:78:9a"
          cli random dummy0
          test "$(addr)" != "02:12:34:56:78:9a"
          cli --json show dummy0
          cli restore dummy0
          test "$(addr)" = "$before"
          cli history
          # A name smuggling a second ip command must never reach `ip -batch`.
          if cli set $'dummy0\nlink set lo down' 02:00:00:00:00:01; then
            echo "::error::malicious interface name was accepted"; exit 1
          fi
          ip link show lo | grep -q "state UNKNOWN"

          # NetworkManager method against a stand-in nmcli (crates/randommac-net/tests/fake-nmcli.sh).
          sudo install -m 0755 crates/randommac-net/tests/fake-nmcli.sh /usr/bin/nmcli
          sudo nmcli fake-setup dummy0
          cloned() { sudo cat "/run/fake-nm/connections/$1/cloned"; }
          cli --json show dummy0 > "$RUNNER_TEMP/show.json"
          grep -q '"networkManager"' "$RUNNER_TEMP/show.json"
          cli set dummy0 02:12:34:56:78:9b
          test "$(addr)" = "02:12:34:56:78:9b"
          test "$(cloned rm-test-a)" = "02:12:34:56:78:9b"
          # The profile had no cloned-mac-address: back to the hardware address, then unset again.
          cli restore dummy0
          test "$(addr)" = "$before"
          test -z "$(cloned rm-test-a)"
          # A driver that ignores the address: the profile is rolled back (exit code 5).
          sudo touch /run/fake-nm/ignore
          if cli set dummy0 02:12:34:56:78:9c; then
            echo "::error::an ignored change was reported as applied"; exit 1
          fi
          sudo rm /run/fake-nm/ignore
          test "$(addr)" = "$before"
          test -z "$(cloned rm-test-a)"
          # Roaming: changed through one profile, restored while another one is active.
          cli set dummy0 02:12:34:56:78:9d
          sudo nmcli --wait 60 connection up uuid rm-test-b
          cli restore dummy0
          test "$(addr)" = "$before"
          test -z "$(cloned rm-test-a)"
          test -z "$(cloned rm-test-b)"
          cli history
      - name: Change DNS through the stand-in NetworkManager
        run: |
          set -euo pipefail
          source <(cargo llvm-cov show-env --sh)
          cli() {
            sudo LLVM_PROFILE_FILE="$LLVM_PROFILE_FILE" ./target/debug/randommac-cli \
              --data-dir "$RUNNER_TEMP/randommac" "$@"
          }
          # The fake nmcli of the previous step, a fake busctl for NetworkManager's DNS mode
          # (crates/randommac-net/tests/fake-busctl.sh) and a local DNS server answering the
          # reachability check that runs before a change.
          sudo mv /usr/bin/busctl /usr/bin/busctl.real
          sudo install -m 0755 crates/randommac-net/tests/fake-busctl.sh /usr/bin/busctl
          sudo nmcli fake-setup dummy0
          cat >"$RUNNER_TEMP/dns-responder.py" <<'PY'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.bind(("127.0.0.2", 53))
          while True:
              query, peer = s.recvfrom(512)
              if len(query) >= 12:
                  reply = bytearray(query)
                  reply[2] |= 0x80  # QR: a response with RCODE 0
                  s.sendto(bytes(reply), peer)
          PY
          sudo python3 "$RUNNER_TEMP/dns-responder.py" &
          sleep 1
          profile() { sudo cat "/run/fake-nm/connections/rm-test-a/$1"; }
          effective() { sudo cat "/run/fake-nm/effective$1"; }
          cli dns show dummy0
          cli --json dns show dummy0 > "$RUNNER_TEMP/dns.json"
          grep -q '"networkManager"' "$RUNNER_TEMP/dns.json"
          # Plain DNS after the reachability check.
          cli dns set dummy0 --servers 127.0.0.2
          test "$(profile dns4)" = 127.0.0.2
          test "$(profile ignore4)" = yes
          test "$(effective 4)" = 127.0.0.2
          # A server that does not answer is refused before anything changes (exit code 5).
          if cli dns set dummy0 --servers 192.0.2.53; then
            echo "::error::a DNS server that does not answer was applied"; exit 1
          fi
          test "$(profile dns4)" = 127.0.0.2
          # DNS over TLS with IPv6; `device reapply` fails, so RandomMac reconnects.
          sudo touch /run/fake-nm/reapply-fail
          cli dns set dummy0 --provider quad9 --encryption dot --no-check
          sudo rm /run/fake-nm/reapply-fail
          test "$(profile dns4)" = "9.9.9.9#dns.quad9.net,149.112.112.112#dns.quad9.net"
          test "$(profile dns6)" = "2620:fe::fe#dns.quad9.net,2620:fe::9#dns.quad9.net"
          test "$(profile dot)" = yes
          test "$(effective 4)" = "9.9.9.9 | 149.112.112.112"
          cli dns show dummy0
          # NetworkManager not keeping the servers: rolled back (exit code 5).
          sudo touch /run/fake-nm/dns-reject
          if cli dns set dummy0 --provider cloudflare --no-check; then
            echo "::error::DNS servers NetworkManager did not keep were reported as applied"; exit 1
          fi
          sudo rm /run/fake-nm/dns-reject
          test "$(profile dot)" = yes
          # No systemd-resolved: DNS over TLS is refused (exit code 6).
          printf default | sudo tee /run/fake-nm/dns-mode >/dev/null
          if cli dns set dummy0 --provider quad9 --encryption dot --no-check; then
            echo "::error::DNS over TLS was accepted without systemd-resolved"; exit 1
          fi
          printf systemd-resolved | sudo tee /run/fake-nm/dns-mode >/dev/null
          # A profile that ignores IPv6 takes the IPv4 servers only, with a warning.
          printf ignore | sudo tee /run/fake-nm/connections/rm-test-a/method6 >/dev/null
          cli dns set dummy0 --servers 192.0.2.53,2001:db8::53 --encryption none --no-check \
            | tee "$RUNNER_TEMP/dns-set.txt"
          grep -q DNS_IPV6_SKIPPED "$RUNNER_TEMP/dns-set.txt"
          test "$(profile dns4)" = 192.0.2.53
          printf auto | sudo tee /run/fake-nm/connections/rm-test-a/method6 >/dev/null
          # Back to the values from before the first change, then nothing left to restore.
          cli dns restore dummy0
          test -z "$(profile dns4)"
          test -z "$(profile dns6)"
          test "$(profile ignore4)" = no
          test "$(profile dot)" = default
          test "$(effective 4)" = 192.0.2.1
          out=$(cli dns restore dummy0)
          grep -q NOTHING_TO_RESTORE <<<"$out"
          # "Automatic" on a profile that was automatic leaves nothing to restore either.
          cli dns set dummy0 --provider google --encryption none --no-check
          cli dns auto dummy0
          test -z "$(profile dns4)"
          test "$(profile ignore4)" = no
          out=$(cli dns restore dummy0)
          grep -q NOTHING_TO_RESTORE <<<"$out"
          cli history
          sudo mv /usr/bin/busctl.real /usr/bin/busctl
      - name: Coverage report
        run: |
          source <(cargo llvm-cov show-env --sh)
          mkdir -p coverage
          cargo llvm-cov report --lcov --output-path coverage/rust-Linux-integration.info
          sed -i "s#^SF:$GITHUB_WORKSPACE/#SF:#" coverage/rust-Linux-integration.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-rust-Linux-integration
          path: coverage/rust-Linux-integration.info
          retention-days: 7
          if-no-files-found: error

  windows-integration:
    name: Windows DNS change (runner adapter)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal --component llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Hosted runners run elevated: the instrumented CLI changes the DNS servers of the adapter
      # with the default route for real (IP Helper API); its coverage of the Windows backend is
      # merged with the unit tests' by the SonarQube Cloud job.
      - name: Build the CLI with coverage instrumentation
        run: |
          cargo llvm-cov show-env --pwsh | Invoke-Expression
          cargo llvm-cov clean --workspace
          cargo build -p randommac-cli --locked
      - name: Find the adapter with the default route
        id: adapter
        run: |
          $route = Get-NetRoute -DestinationPrefix 0.0.0.0/0 |
            Sort-Object { $_.RouteMetric + $_.InterfaceMetric } | Select-Object -First 1
          $nic = Get-NetAdapter -InterfaceIndex $route.InterfaceIndex
          "name=$($nic.Name)" >> $env:GITHUB_OUTPUT
          "guid=$($nic.InterfaceGuid)" >> $env:GITHUB_OUTPUT
          Get-DnsClientServerAddress -InterfaceIndex $nic.ifIndex | Format-Table -AutoSize
      - name: Set plain DNS and DNS over HTTPS, restore, automatic
        env:
          ADAPTER: ${{ steps.adapter.outputs.name }}
          GUID: ${{ steps.adapter.outputs.guid }}
        run: |
          cargo llvm-cov show-env --pwsh | Invoke-Expression
          # Not `cli`: that is PowerShell's alias of Clear-Item, and aliases win over functions.
          function Invoke-RandomMac {
            & ./target/debug/randommac-cli.exe --data-dir "$env:RUNNER_TEMP/randommac" @args
            if ($LASTEXITCODE -ne 0) { throw "randommac-cli $args exited with $LASTEXITCODE" }
          }
          function servers {
            (Get-DnsClientServerAddress -InterfaceAlias $env:ADAPTER -AddressFamily IPv4).ServerAddresses -join ','
          }
          function doh { (Invoke-RandomMac --json dns show $env:ADAPTER | ConvertFrom-Json).status.dohTemplate }
          $quad9 = "HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\InterfaceSpecificParameters\$env:GUID\DohInterfaceSettings\Doh\9.9.9.9"
          $dhcp = servers
          Invoke-RandomMac dns show $env:ADAPTER
          Invoke-RandomMac dns set $env:ADAPTER --provider quad9 --encryption none --no-check
          if ((servers) -ne '9.9.9.9,149.112.112.112') { throw "IPv4 servers: $(servers)" }
          if (doh) { throw "unexpected DoH template: $(doh)" }
          Invoke-RandomMac dns set $env:ADAPTER --provider quad9 --encryption doh --no-check
          if ((doh) -ne 'https://dns.quad9.net/dns-query') { throw "DoH template: $(doh)" }
          if (-not (Test-Path $quad9)) { throw 'no DoH settings for 9.9.9.9' }
          Invoke-RandomMac dns show $env:ADAPTER
          # Back to DHCP, without the DoH settings of the servers that were set.
          Invoke-RandomMac dns restore $env:ADAPTER
          if ((servers) -ne $dhcp) { throw "after restore: $(servers), expected $dhcp" }
          if (Test-Path $quad9) { throw 'the DoH settings of 9.9.9.9 were left behind' }
          Invoke-RandomMac dns set $env:ADAPTER --provider cloudflare --encryption none --no-check
          Invoke-RandomMac dns auto $env:ADAPTER
          if ((servers) -ne $dhcp) { throw "after automatic: $(servers), expected $dhcp" }
          Invoke-RandomMac dns restore $env:ADAPTER
          Invoke-RandomMac history
      - name: Reset the adapter's DNS servers
        if: always() && steps.adapter.outputs.name != ''
        env:
          ADAPTER: ${{ steps.adapter.outputs.name }}
        run: |
          Set-DnsClientServerAddress -InterfaceAlias $env:ADAPTER -ResetServerAddresses
          Get-DnsClientServerAddress -InterfaceAlias $env:ADAPTER | Format-Table -AutoSize
      - name: Coverage report
        run: |
          cargo llvm-cov show-env --pwsh | Invoke-Expression
          New-Item -ItemType Directory -Force coverage | Out-Null
          cargo llvm-cov report --lcov --output-path coverage/rust-Windows-integration.info
          node scripts/lcov-paths.mjs coverage/rust-Windows-integration.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-rust-Windows-integration
          path: coverage/rust-Windows-integration.info
          retention-days: 7
          if-no-files-found: error

  bundle:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file rpm xvfb dbus-x11
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: bundle
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the CLI sidecar
        run: node scripts/build-sidecar.mjs
      - name: Build bundles (unsigned, no updater artifacts)
        shell: bash
        run: npx tauri build --ci --bundles "${{ matrix.bundles }}" --config '{"bundle":{"externalBin":["binaries/randommac-cli"]}}'

      - name: Inspect and install the .deb
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd target/release/bundle
          ls -la deb rpm appimage
          dpkg-deb -I deb/*.deb
          dpkg-deb -c deb/*.deb | grep -E 'usr/bin/(randommac|randommac-cli)$'
          rpm -qpR rpm/*.rpm
          sudo apt-get install -y ./deb/*.deb
          randommac --version
          randommac-cli --version
          randommac-cli list --all
          WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- xvfb-run -a randommac --smoke-test
      - name: Install the .rpm on Fedora
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/target/release/bundle/rpm:/pkgs:ro" fedora:43 \
            bash -euxc 'dnf install -y /pkgs/*.rpm && randommac-cli --version && randommac --version && rpm -qa | grep -i random'

      - name: Install, smoke-test and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Simulate the elevated logon task RandomMac 1.x left behind.
          $legacy = Join-Path $env:LOCALAPPDATA 'RandomMac\current\RandomMac.App.exe'
          schtasks /Create /TN RandomMac /TR "`"$legacy`"" /SC ONLOGON /RL HIGHEST /F | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = 'C:\Program Files\RandomMac\randommac.exe'
          if (-not (Test-Path $exe)) { throw 'not installed to Program Files' }
          if (-not (Test-Path 'C:\Program Files\RandomMac\randommac-cli.exe')) { throw 'CLI sidecar missing' }
          schtasks /Query /TN RandomMac 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'legacy v1 task was not removed' }
          $global:LASTEXITCODE = 0
          & 'C:\Program Files\RandomMac\randommac-cli.exe' list --all
          $p = Start-Process $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed ($($p.ExitCode))" }
          Start-Process 'C:\Program Files\RandomMac\uninstall.exe' -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw 'uninstall left the executable behind' }
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $i = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "msi install failed ($($i.ExitCode))" }
          $u = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msi uninstall failed ($($u.ExitCode))" }

      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

  deps-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      # cargo-deny above checks the crates' licenses (deny.toml); this checks every npm package in
      # package-lock.json against the allow-list in scripts/lib/licenses.mjs.
      - name: npm licenses
        run: node scripts/check-licenses.mjs

  dependency-review:
    name: Dependency review
    # Blocks a pull request that adds a dependency with a high or critical advisory (any ecosystem,
    # GitHub Actions included). Licenses are checked for the whole tree in "Dependency audit": the
    # dependency graph's license data is incomplete for npm and Cargo.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false

  sonar:
    name: SonarQube Cloud
    needs: [frontend, rust, linux-integration, windows-integration]
    # SONAR_TOKEN is not available to pull requests from forks or from Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: blame data for new-code detection and issue assignment.
          fetch-depth: 0
          persist-credentials: false
      # The Rust analyzer needs Cargo; the TypeScript analyzer resolves types from node_modules.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Project version
        id: version
        run: echo "version=$(node scripts/version.mjs get)" >> "$GITHUB_OUTPUT"
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Settings are in sonar-project.properties; fail the job when the quality gate fails.
          args: >
            -Dsonar.projectVersion=${{ steps.version.outputs.version }}
            -Dsonar.qualitygate.wait=true
