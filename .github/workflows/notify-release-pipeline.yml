name: Notify Release Pipeline

on:
  workflow_run:
    # MUST match `name: Release` in release.yml.
    workflows:
      - "Release"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: contains(fromJSON('["success","failure","cancelled"]'), github.event.workflow_run.conclusion)
    uses: poli0981/.github/.github/workflows/notify-release-pipeline.yml@main
    secrets:
      DISCORD_RELEASE_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_PIPELINE_WEBHOOK }}
