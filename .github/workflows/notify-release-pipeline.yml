name: Notify Release Pipeline

on:
  workflow_run:
    # Release-related workflows only. Names below MUST match the `name:`
    # field of each watched workflow. Renaming any of those → update list.
    #   release.yml          → name: "Release"
    #   announce-release.yml → name: "Announce Release to Discord"
    workflows:
      - "Release"
      - "Announce Release to Discord"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: contains(fromJSON('["success","failure","cancelled"]'), github.event.workflow_run.conclusion)
    uses: poli0981/.github/.github/workflows/notify-release-pipeline.yml@main
    secrets: inherit
