name: Announce Release to Discord

# Started by release.yml with `gh workflow run` (a release published with GITHUB_TOKEN does not
# trigger `release: published`), or by hand to re-announce a release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to announce"
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    uses: poli0981/.github/.github/workflows/announce-release.yml@main
    with:
      tag_override: ${{ inputs.tag || '' }}
    # Only the secrets this workflow needs (not `inherit`).
    secrets:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      DISCORD_REPO_WEBHOOK: ${{ secrets.DISCORD_REPO_WEBHOOK }}
      DISCORD_PING_ROLE_ID: ${{ secrets.DISCORD_PING_ROLE_ID }}
