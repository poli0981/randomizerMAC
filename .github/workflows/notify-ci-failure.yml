name: Notify CI Failures

on:
  workflow_run:
    # Names MUST match the `name:` of the watched workflows. Release failures are reported by
    # notify-release-pipeline.yml instead.
    workflows:
      - "CI"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@main
    secrets:
      DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
