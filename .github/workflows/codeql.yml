name: CodeQL

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
  schedule:
    - cron: '0 14 * * 1'  # Monday 14:00 UTC = 21:00 ICT
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    uses: poli0981/.github/.github/workflows/codeql-csharp.yml@main
    with:
      dotnet_version: "11.0.x"
