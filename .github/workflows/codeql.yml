name: CodeQL

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

# REQUIRED: caller must declare permissions equal-or-greater than what the
# reusable workflow requests. Reusables can NOT escalate beyond what the
# caller grants — this is a GitHub security boundary, not a bug.
permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    uses: poli0981/.github/.github/workflows/codeql-csharp.yml@main
    with:
      dotnet_version: "11.0.x"
